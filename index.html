<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assignment Cover Page</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Times New Roman", serif;
}

body{
    background:#f1f5f9;
    padding:20px;
}

.container{
    max-width:1400px;
    margin:auto;
    display:grid;
    grid-template-columns:350px 1fr;
    gap:20px;
}

/* FORM BOX */
.form-box{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
    height:fit-content;
}

.form-box h2{
    text-align:center;
    margin-bottom:20px;
    font-size:24px;
}

.input-box{ margin-bottom:12px; }
.input-box label{ display:block; margin-bottom:4px; font-size:14px; font-weight:bold; color: #334155; }
.input-box input{ width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; font-size:15px; outline:none; }

.btn-download {
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#1d4ed8;
    color:white;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

/* PREVIEW BOX */
.preview-box{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.preview-title{ text-align:center; font-size:28px; margin-bottom:15px; color: #444; }

/* PAGE (A4 SETUP) */
.page{
    width:794px;
    height:1120px;
    margin:auto;
    border:1px solid #eee;
    padding:50px 60px;
    background:white;
    overflow: hidden;
}

.inst-name{ text-align:center; font-size:28px; font-weight:bold; line-height:1.2; }
.inst-place{ text-align:center; font-size:22px; font-weight:bold; margin-top:5px; }

/* LOGO SPACE */
.logo-box{
    text-align:center;
    margin:20px 0;
    height: 160px;
    display: flex;
    justify-content: center;
    align-items: center;
}
.logo-box img{
    max-height: 160px;
    width: auto;
}

.department{ text-align:center; font-size:24px; font-weight:bold; min-height: 1.2em; text-transform: uppercase; }

/* FADED LINE */
.line{ 
    height:1px; 
    background:#e2e8f0; 
    margin:25px 0; 
}

.assignment{ text-align:center; font-size:26px; font-weight:bold; }

.section{ text-align:center; line-height:2.0; font-size:22px; }
.section h3{ margin-bottom:10px; font-size:26px; border-bottom: 1px solid #eee; display: inline-block; padding-bottom: 2px; }

/* PRINT MEDIA */
@media print {
    @page { size: A4; margin: 0; }
    body { background: white; padding: 0; margin: 0; }
    .form-box, .preview-title { display: none !important; }
    .container { display: block; }
    .preview-box { padding: 0; box-shadow: none; }
    .page { 
        border: none; 
        width: 100%; 
        height: 100vh;
        padding: 60px;
    }
    .line { 
        background-color: #e2e8f0 !important; 
        -webkit-print-color-adjust: exact; 
        print-color-adjust: exact; 
    }
}
</style>

</head>
<body>

<div class="container">
    <div class="form-box">
        <h2>Enter Details</h2>
        <div class="input-box"><label>Assignment No.</label><input type="text" id="assignment" placeholder="e.g. 01" oninput="updatePreview()"></div>
        
        <div class="input-box"><label>Main Department (Logo Bottom)</label><input type="text" id="Dept" placeholder="e.g. Electrical Engineering" oninput="updatePreview()"></div>
        
        <div class="input-box"><label>Subject Name</label><input type="text" id="subject" oninput="updatePreview()"></div>
        <div class="input-box"><label>Subject Code</label><input type="text" id="code" oninput="updatePreview()"></div>
        <div class="input-box"><label>Student Name</label><input type="text" id="name" oninput="updatePreview()"></div>
        <div class="input-box"><label>Roll Number</label><input type="text" id="roll" oninput="updatePreview()"></div>
        <div class="input-box"><label>Year / Semester</label><input type="text" id="semester" oninput="updatePreview()"></div>
        <div class="input-box"><label>Submitted To (Teacher Name)</label><input type="text" id="teacher" oninput="updatePreview()"></div>
        <div class="input-box"><label>Teacher's Designation</label><input type="text" id="designation" oninput="updatePreview()"></div>
        
        <div class="input-box"><label>Teacher's Department</label><input type="text" id="teacherDept" placeholder="e.g. Dept. of Applied Science" oninput="updatePreview()"></div>
        
        <button class="btn-download" onclick="window.print()">Download PDF</button>
    </div>

    <div class="preview-box">
        <div class="preview-title">Live Preview</div>
        
        <div class="page" id="page">
            <div class="inst-name">THDC Institute of Hydropower Engineering and Technology</div>
            <div class="inst-place">Tehri Garhwal (Uttarakhand)</div>
            
            <div class="logo-box">
                <img src="logo.png" alt="Logo">
            </div>

            <div class="department" id="pMainDept"></div>
            
            <div class="line"></div>
            
            <div class="assignment">Assignment No.: <span id="passignment"></span></div>
            <div class="line"></div>
            
            <div class="section">
                <div><b>Subject Name:</b> <span id="psubject"></span></div>
                <div><b>Subject Code:</b> <span id="pcode"></span></div>
            </div>
            
            <div class="line"></div>

            <div class="section">
                <h3>Submitted By:</h3>
                <div><b>Name:</b> <span id="pname"></span></div>
                <div><b>Roll Number:</b> <span id="proll"></span></div>
                <div><b>Year / Semester:</b> <span id="psemester"></span></div>
            </div>

            <div class="line"></div>

            <div class="section">
                <h3>Submitted To:</h3>
                <div><b id="pteacher"></b></div>
                <div id="pdesignation"></div>
                <div id="pteacherDept"></div>
                <div>THDC-IHET</div>
            </div>
            <div class="line"></div>
        </div>
    </div>
</div>

<script>
function updatePreview(){
    // IDs list
    const fields = ['assignment', 'mainDept', 'subject', 'code', 'name', 'roll', 'semester', 'teacher', 'designation', 'teacherDept'];
    
    fields.forEach(id => {
        const val = document.getElementById(id).value;
        const pElement = document.getElementById('p' + id);
        
        if(pElement) {
            if(id === 'mainDept') {
                // Formatting for Logo bottom
                pElement.innerText = val ? "DEPARTMENT OF " + val.toUpperCase() : "";
            } else {
                pElement.innerText = val;
            }
        }
    });
}
</script>

</body>
</html>
